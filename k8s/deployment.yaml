apiVersion: apps/v1
kind: Deployment
metadata:
  name: article-platform-app
  namespace: article-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: article-platform-app
  template:
    metadata:
      labels:
        app: article-platform-app
    spec:
      serviceAccountName: app-sa
      containers:
      - name: article-platform-app
        image: ghcr.io/abubakar-tq/cloud-native-article-platform:latest
        envFrom:
        - configMapRef:
            name: article-platform-config
        - secretRef:
            name: article-platform-secrets
        resources:
          requests:
           memory: "128Mi"
           cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
